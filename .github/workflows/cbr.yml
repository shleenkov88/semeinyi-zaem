name: Ключевая ставка ЦБ
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Скачать ставку ЦБ
        run: node scripts/fetch-cbr.mjs
      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cbr.json
          git diff --cached --quiet || git commit -m "Ключевая ставка ЦБ"
          git push
